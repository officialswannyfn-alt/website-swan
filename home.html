<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Character Viewer — Modern</title>
<style>
  :root{
  --bg: #0e0f14;
  --panel: rgba(0, 0, 0, 0.6);
  --panel-soft: rgba(0, 0, 0, 0.4);

  --text: #ffffff;
  --muted: rgba(255, 255, 255, 0.8);

  /* Signature purple matching other views */
  --accent: #667eea;
  --accent-soft: #764ba2;
  --accent-dark: #4b2a7a;

  --border: rgba(255, 255, 255, 0.1);
  --glass: rgba(0, 0, 0, 0.5);
  --bg-gradient: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.75));
}
  *{box-sizing:border-box}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  html,body{height:100%;margin:0;font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color:var(--text); background:var(--bg-gradient), url("images/bg.png") center / cover no-repeat fixed; transition: background 0.5s ease;}
  /* page layout */
  .wrap{
    height:100vh;
    display:grid;
    grid-template-columns: 100px 1fr;
    grid-template-rows: 65vh auto;
    grid-template-areas: "nav art" "nav info";
    gap:0;
    padding:0;
    position:relative;
    overflow:hidden;
    overflow-y:auto;
  }

  /* VISUAL ENHANCEMENTS FOR EMPTINESS */
  .grid-overlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: 
      linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }
  
  .faction-watermark {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(-15deg);
    font-size: 20vw;
    font-weight: 900;
    color: var(--accent);
    opacity: 0.04;
    pointer-events: none;
    z-index: -1;
    white-space: nowrap;
    transition: all 0.5s ease;
    user-select: none;
  }

  .particles {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  .particle {
    position: absolute;
    background: var(--accent);
    border-radius: 50%;
    opacity: 0.3;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    20% { opacity: 0.4; }
    80% { opacity: 0.4; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  /* huge faint title behind */
  .backdrop {
    position:fixed;
    left:50%;
    top:20%;
    transform: translateX(-50%);
    font-weight:800;
    font-size:300px;
    letter-spacing:5px;
    color:rgba(102, 126, 234, 0.08);
    pointer-events:none;
    user-select:none;
    z-index:0;
  }

  /* left vertical thumbnails */
  .left-bar{
    grid-area: nav;
    position: sticky;
    top: 0;
    height: 100vh;
    background: rgba(0,0,0,0.3);
    border-right: 1px solid var(--border);
    z-index:3;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    padding-top:40px;
    padding-bottom: 20px;
  }
  .logo{
    width:80px;height:80px;border-radius:14px;background:linear-gradient(135deg, #667eea 0%, #764ba2 100%);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;box-shadow:0 6px 18px rgba(102, 126, 234, 0.4);
    cursor:pointer;transition:transform 0.2s ease;
  }
  .logo:hover{transform:scale(1.05);}
  .thumb{
    width:80px;height:80px;border-radius:14px;overflow:hidden;border:3px solid rgba(255,255,255,0.1);cursor:pointer;transition:all .24s;filter:grayscale(.2);
    display:block;object-fit:cover;
  }
  .thumb.active{ border-color: #667eea; box-shadow:0 6px 26px rgba(102, 126, 234, 0.6); filter:none; transform:translateY(-4px); }

  /* center panel (info) */
  .center{
    grid-area: info;
    z-index:3;
    padding:40px;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
    display:flex;
    flex-direction:column;
    gap:18px;
    align-items:center;
    text-align: center;
    position: relative;
    background: transparent;
    padding-top: 10px;
  }
  /* New Split Layout */
  .info-split {
    display: flex;
    flex-direction: row;
    align-items: flex-start;
    justify-content: center;
    gap: 40px;
    width: 100%;
    max-width: 1200px;
    margin-top: 10px;
  }
  .info-left { flex: 2; display: flex; flex-direction: column; gap: 18px; align-items: center; width: 100%; }
  .info-right { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 300px; width: 100%; }

  /* DENSE DATA STYLES */
  .panel-header {
    width: 100%; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 12px;
    font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); font-weight: 800;
    display: flex; justify-content: space-between; align-items: center;
  }
  .data-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; width: 100%;
  }
  .data-cell {
    background: rgba(0,0,0,0.3); border: 1px solid var(--border); padding: 8px 10px; border-radius: 6px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .data-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
  .data-value { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ATTRIBUTE BARS */
  .attr-section { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .attr-row { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .attr-row:last-child { margin-bottom: 0; }
  .attr-name { width: 40px; font-size: 11px; font-weight: 800; color: var(--muted); }
  .attr-track { flex: 1; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
  .attr-fill { height: 100%; background: linear-gradient(90deg, var(--accent) 0%, var(--accent-soft) 100%); width: 0%; transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1); }
  .attr-val { width: 30px; text-align: right; font-size: 11px; font-weight: 700; color: #fff; }

  /* RELATIONSHIPS */
  .rel-grid { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 4px; width: 100%; }
  .rel-item { min-width: 60px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .rel-avatar { width: 48px; height: 48px; border-radius: 50%; background: #333; border: 2px solid var(--border); object-fit: cover; }
  .rel-name { font-size: 10px; color: var(--muted); text-align: center; }

  .character-name{
    display:flex;gap:14px;align-items:center;justify-content:center;width:100%;
  }
  .faction-badge {
  padding: 8px 16px;
  border-radius: 10px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-soft) 100%);
  color: #fff;
  /* The Glow Effect */
  box-shadow: 
    0 0 15px var(--accent), 
    0 0 30px rgba(102, 126, 234, 0.3),
    inset 0 0 8px rgba(255, 255, 255, 0.4);
  text-shadow: 0 2px 4px rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.2);
}
  .title{
    font-size:36px;font-weight:800;
    background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  }
  .meta-row{display:flex;gap:12px;align-items:center;margin-top:6px;font-size:13px;color:var(--muted)}
  .desc{
    margin-top:0; background:rgba(0,0,0,0.6); padding:20px; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.3); border:2px solid rgba(255,255,255,0.1); width:100%; line-height:1.5; color:var(--text); text-align: left; font-size: 14px;
  }
  .tags{display:flex;gap:8px;margin-top:12px}
  .tag{padding:6px 10px;border-radius:8px;background:rgba(255,255,255,0.05);color:var(--text);font-weight:600;border:2px solid rgba(255,255,255,0.1);transition:all 0.3s ease;}
  .tag:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.3);}

  /* right big art area */
  .hero{
    grid-area: art;
    z-index:2;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px 40px 0 40px;
    overflow: visible;
  }
  .art-stage{
    width:100%;
    height:100%;
    max-height:none;
    background:rgba(0,0,0,0.3);
    border-radius:24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    border:1px solid rgba(255,255,255,0.1);
    position:relative;
    overflow:hidden;
    backdrop-filter: blur(10px);
  }

  /* purple gradient accent behind art */
 .art-stage::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 60%;
  height: 60%;
  /* Creates a soft "aura" that matches the faction color */
  background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
  opacity: 0.4;
  z-index: 1;
  filter: blur(40px);
  pointer-events: none;
}
.art-stage::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image: 
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 40px 40px; /* Size of the grid squares */
  mask-image: radial-gradient(circle, black 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(circle, black 30%, transparent 80%);
  opacity: 0.15;
  z-index: 0;
  pointer-events: none;
}

  /* character image itself */
 /* character image itself */
.character-art{
  position:absolute;
  bottom: 0; /* Sits exactly on the bottom edge of the stage */
  left:50%;
  transform:translateX(-50%); /* Perfectly centers horizontally */
  /* SIZING CHANGES FOR BIGGER ART */
  height: 92%; /* Fills the height of the stage almost completely */
  width: auto; /* Lets width adjust naturally so it doesn't stretch */
  max-width: 100%; /* Ensures it doesn't spill out the sides */
  /* standard properties */
  z-index:3;
  object-fit:contain;
  transition: transform .5s ease, opacity .35s;
  user-select:none;
  pointer-events:none;
  /* Optional: adds a slight drop shadow to separate art from background */
  filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5));
}
.character-art.hidden{
  opacity:0;
  /* Match the new translateX(-50%) center point */
  transform:translateX(-50%) translateY(30px) scale(.95);
}

  /* small right-side controls / badges */
  .controls{
    position:absolute;
    right:18px;
    top:28px;
    transform:none;
    display:flex;
    gap:12px;
    flex-direction:column;
    z-index:6;
  }
  .control-btn{
    width:48px;height:48px;border-radius:16px;background:rgba(0,0,0,0.6);border:2px solid rgba(255,255,255,0.1);box-shadow:0 8px 22px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;color:var(--text);transition:all 0.3s ease;
  }
  .control-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.3);transform:translateY(-2px);}

  /* outfit arrows and dots */
  .outfit-controls{
    position:absolute;
    left:50%;
    transform: translateX(-50%);
    bottom:24px;
    display:flex;
    gap:12px;
    align-items:center;
    z-index:4;
  }
  .arrow{
    width:46px;height:46px;border-radius:12px;background:rgba(0,0,0,0.6);border:2px solid rgba(255,255,255,0.1);box-shadow:0 8px 24px rgba(0,0,0,0.3);cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--text);transition:all 0.3s ease;
  }
  .arrow:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.3);transform:translateY(-2px);}
  .dots{display:flex;gap:8px;align-items:center}
  .dot{width:12px;height:12px;border-radius:100%;background:rgba(255,255,255,0.2);border:2px solid rgba(255,255,255,0.1);cursor:pointer;box-shadow:0 6px 12px rgba(0,0,0,0.3);transition:all 0.3s ease;}
  .dot:hover{background:rgba(255,255,255,0.3);transform:scale(1.1);}
  .dot.active{ background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-color:#667eea; transform:scale(1.15); box-shadow:0 0 15px rgba(102, 126, 234, 0.6); }

  /* stats box bottom */
  .stats{
    margin-top:10px; display:flex; gap:10px; flex-wrap:wrap; justify-content: center;
  }
  .stat{background:rgba(0,0,0,0.6);padding:10px 12px;border-radius:10px;font-weight:700;min-width:120px;text-align:center;box-shadow:0 8px 22px rgba(0,0,0,0.3);border:2px solid rgba(255,255,255,0.1);transition:all 0.3s ease;}
  .stat:hover{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.3);transform:translateY(-2px);}

  /* gear / weapons section */
  .gear-section{ margin-top:0; width:100%; animation:fadeIn 0.5s ease; text-align: left; }
  .gear-title{ font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--muted); font-weight:700; margin-bottom:12px; border-bottom:1px solid var(--border); padding-bottom:8px; }
  .gear-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:16px; }
  .gear-item{
    background:rgba(0,0,0,0.4); border:1px solid var(--border); border-radius:12px; padding:14px; display:flex; align-items:center; gap:16px; transition:all 0.2s ease;
  }
  .gear-item:hover{ background:rgba(255,255,255,0.1); transform:translateY(-2px); border-color:var(--accent); }
  .gear-icon{
    width:54px; height:54px; background:linear-gradient(135deg, var(--accent) 0%, var(--accent-soft) 100%); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:28px; box-shadow:0 4px 10px rgba(0,0,0,0.3); overflow:hidden; flex-shrink:0;
  }
  .gear-icon img { width:100%; height:100%; object-fit:cover; }
  .gear-info{ display:flex; flex-direction:column; gap:2px; }
  .gear-name{ font-size:15px; font-weight:700; color:#fff; }
  .gear-type{ font-size:13px; color:var(--muted); }

  /* scroll buttons */
  .scroll-btn {
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
    width: 100%; height: 24px; display: flex; align-items: center; justify-content: center;
    border-radius: 6px; cursor: pointer; transition: all 0.2s; font-size: 10px;
  }
  .scroll-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--accent); }
  .scroll-btn.disabled { opacity: 0.3; pointer-events: none; }

  /* small responsive */
  @media (max-width:1100px){
    .wrap{grid-template-columns:100px 1fr; grid-template-rows: 50vh auto;}
    .backdrop{font-size:200px;}
    .character-art{height:90%}
    .info-split { flex-direction: column; align-items: center; }
    .info-right { width: 100%; max-width: 800px; }
    .info-left { width: 100%; max-width: 800px; }
    .gear-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
  }
  @media (max-width:860px){
    .wrap{grid-template-columns:90px 1fr; grid-template-rows: 40vh auto; padding:0}
    .hero{grid-area: art;}
    .backdrop{display:none}
    .character-art{height:95%}
    .controls{top:10px; right:10px}
  }
  @media (max-width:520px){
    .wrap{grid-template-columns:90px 1fr; grid-template-rows: 35vh auto;}
    .title{font-size:22px}
    .faction-badge{font-size:12px;padding:6px 10px}
    .character-art{height:90%}
  }
</style>
</head>

  <!-- RIGHT: hero -->

      <!-- floating controls -->

        <button class="control-btn" title="Toggle BG">BG</button>
        <button class="control-btn" title="Toggle UI">•••</button>

</div>

const debutEl = document.getElementById('debut');
const affilEl = document.getElementById('affil');
const dataGrid = document.getElementById('dataGrid');
const attrList = document.getElementById('attrList');
const relGrid = document.getElementById('relGrid');
const gearGrid = document.getElementById('gearGrid');
const thumbsEl = document.getElementById('thumbs');
const dotsEl = document.getElementById('dots');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const scrollUpBtn = document.getElementById('scrollUp');
const scrollDownBtn = document.getElementById('scrollDown');

function init(){
  createParticles();
  renderThumbs();
  loadCharacter(0);
  prevBtn.addEventListener('click',()=>changeOutfit(-1));
  nextBtn.addEventListener('click',()=>changeOutfit(1));
  scrollUpBtn.addEventListener('click', ()=> scrollThumbs(-1));
  scrollDownBtn.addEventListener('click', ()=> scrollThumbs(1));

  const stage = document.querySelector('.art-stage');
  
  stage.addEventListener('mousemove',(e)=>{
    const rect = stage.getBoundingClientRect();
    
    // Calculate mouse position relative to center (ranges from -0.5 to 0.5)
    const cx = (e.clientX - rect.left) / rect.width - 0.5;
    const cy = (e.clientY - rect.top) / rect.height - 0.5;
    
    // SETTINGS: Change these numbers to adjust intensity
    // Lower numbers = more subtle movement
    const intensityX = 15; 
    const intensityY = 10;

    // We MUST keep the translateX(-50%) here so it stays centered!
    artImg.style.transform = `translateX(-50%) translate(${cx * intensityX}px, ${cy * intensityY}px)`;
  });

  stage.addEventListener('mouseleave',()=>{
    // Reset to perfect center when mouse leaves
    artImg.style.transform = `translateX(-50%) translateY(0)`;
  });
}

function renderThumbs(){
  thumbsEl.innerHTML='';
  const visibleChars = CHARACTERS.slice(scrollOffset, scrollOffset + VISIBLE_COUNT);
  
  visibleChars.forEach((c, index)=>{
    const realIndex = scrollOffset + index;
    const img = document.createElement('img');
    img.src = c.thumbnail || c.outfits[0];
    img.alt = c.name;
    img.className = 'thumb' + (realIndex===current ? ' active' : '');
    img.addEventListener('click', ()=> loadCharacter(realIndex));
    thumbsEl.appendChild(img);
  });
  updateScrollButtons();
}

function scrollThumbs(direction) {
  const maxOffset = Math.max(0, CHARACTERS.length - VISIBLE_COUNT);
  scrollOffset += direction;
  if (scrollOffset < 0) scrollOffset = 0;
  if (scrollOffset > maxOffset) scrollOffset = maxOffset;
  renderThumbs();
}

function updateScrollButtons() {
  const maxOffset = Math.max(0, CHARACTERS.length - VISIBLE_COUNT);
  scrollUpBtn.classList.toggle('disabled', scrollOffset <= 0);
  scrollDownBtn.classList.toggle('disabled', scrollOffset >= maxOffset);
}

function updateThumbsActive(){
  document.querySelectorAll('.thumb').forEach((t, i)=> {
    const realIndex = scrollOffset + i;
    t.classList.toggle('active', realIndex === current);
  });
}

function loadCharacter(index){
  current = index;
  outfit = 0;
  const c = CHARACTERS[current];

  // Update faction colors
  updateFactionColors(c.faction);

  // fade transition
  artImg.classList.add('hidden');
  setTimeout(()=>{
    artImg.src = c.outfits[outfit];
    nameEl.textContent = c.name;
    badgeEl.textContent = c.factionName || c.faction;
    descEl.textContent = c.description;
    document.getElementById('factionWatermark').textContent = (c.factionName || c.faction).split(' ')[0].toUpperCase();
    debutEl.textContent = 'Debut: ' + (c.debut || '—');
    affilEl.textContent = 'Faction: ' + (c.factionName || c.faction);
    renderDenseData();
    renderAttributes();
    renderRelationships();
    renderDots();
    renderGear();
    updateThumbsActive();
    artImg.classList.remove('hidden');
  }, 200);
}

function changeOutfit(dir){
  const c = CHARACTERS[current];
  if(!c.outfits || c.outfits.length<=1) return;
  outfit = (outfit + dir + c.outfits.length) % c.outfits.length;
  // small fade
  artImg.classList.add('hidden');
  setTimeout(()=> {
    artImg.src = c.outfits[outfit];
    highlightDot(outfit);
    artImg.classList.remove('hidden');
  }, 160);
}

function renderDots(){
  dotsEl.innerHTML='';
  const c = CHARACTERS[current];
  if(!c.outfits || c.outfits.length<=1) return;
  c.outfits.forEach((o, idx)=>{
    const d = document.createElement('div');
    d.className = 'dot' + (idx===outfit ? ' active' : '');
    d.addEventListener('click', ()=> {
      outfit = idx;
      artImg.classList.add('hidden');
      setTimeout(()=>{ artImg.src = c.outfits[outfit]; artImg.classList.remove('hidden'); highlightDot(outfit); }, 160);
    });
    dotsEl.appendChild(d);
  });
}

function highlightDot(i){
  document.querySelectorAll('.dot').forEach((d, idx)=> d.classList.toggle('active', idx===i));
}

function renderDenseData(){
  const c = CHARACTERS[current];
  dataGrid.innerHTML = '';
  
  const fields = [
    {k: 'Race', v: c.race},
    {k: 'Status', v: c.status},
    {k: 'Role', v: c.role},
    {k: 'Height', v: c.height || '???'},
    {k: 'Weight', v: c.weight || '???'},
    {k: 'Age', v: c.age || '???'}
  ];
  
  fields.forEach(f => {
    const el = document.createElement('div');
    el.className = 'data-cell';
    el.innerHTML = `<div class="data-label">${f.k}</div><div class="data-value">${f.v}</div>`;
    dataGrid.appendChild(el);
  });
}

function renderAttributes(){
  const c = CHARACTERS[current];
  attrList.innerHTML = '';
  if(!c.attributes) return;
  
  Object.entries(c.attributes).forEach(([key, val]) => {
    const row = document.createElement('div');
    row.className = 'attr-row';
    row.innerHTML = `
      <div class="attr-name">${key}</div>
      <div class="attr-track"><div class="attr-fill" style="width:${val}%"></div></div>
      <div class="attr-val">${val}</div>
    `;
    attrList.appendChild(row);
  });
}

function renderRelationships(){
  const c = CHARACTERS[current];
  relGrid.innerHTML = '';
  if(!c.relationships) return;
  
  c.relationships.forEach(r => {
    const el = document.createElement('div');
    el.className = 'rel-item';
    el.innerHTML = `<img src="${r.avatar}" class="rel-avatar"><div class="rel-name">${r.name}</div>`;
    relGrid.appendChild(el);
  });
}

function updateFactionColors(faction){
  const colors = FACTION_COLORS[faction] || FACTION_COLORS.shadow;
  const root = document.documentElement;
  
  root.style.setProperty('--accent', colors.primary);
  root.style.setProperty('--accent-soft', colors.secondary);
  root.style.setProperty('--accent-dark', colors.dark);

  // Dynamic background tint based on faction
  // Uses the dark faction color with transparency to tint the background image
  root.style.setProperty('--bg-gradient', `linear-gradient(to bottom, ${colors.dark}CC, #050505F2)`);
}

function renderGear(){
  gearGrid.innerHTML = '';
  const c = CHARACTERS[current];
  if(!c.gear || c.gear.length === 0) {
    document.getElementById('gearSection').style.display = 'none';
    return;
  }
  document.getElementById('gearSection').style.display = 'block';
  
  c.gear.forEach(item => {
    // Check if icon is an image path (contains . or /) or just an emoji
    const isImage = item.icon && (item.icon.includes('.') || item.icon.includes('/'));
    const iconContent = isImage 
      ? `<img src="${item.icon}" alt="${item.name}">` 
      : item.icon;

    const el = document.createElement('div');
    el.className = 'gear-item';
    el.innerHTML = `
      <div class="gear-icon">${iconContent}</div>
      <div class="gear-info">
        <div class="gear-name">${item.name}</div>
        <div class="gear-type">${item.type}</div>
      </div>
    `;
    gearGrid.appendChild(el);
  });
}

function createParticles() {
  const container = document.getElementById('particles');
  const particleCount = 25;
  
  for(let i=0; i<particleCount; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const size = Math.random() * 4 + 2;
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (Math.random() * 10 + 10) + 's';
    p.style.animationDelay = (Math.random() * 10) * -1 + 's';
    container.appendChild(p);
  }
}

init();
</script>

</body>
</html>
